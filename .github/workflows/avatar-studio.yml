name: avatar-studio

on:
  push:
    paths: ["avatar-studio/**", ".github/workflows/avatar-studio.yml"]
  pull_request:
    paths: ["avatar-studio/**", ".github/workflows/avatar-studio.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avatar-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: avatar-studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

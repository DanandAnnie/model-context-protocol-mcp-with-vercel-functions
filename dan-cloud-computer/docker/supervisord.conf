; Dan Cloud Computers - process supervisor for the desktop container.
; Starts the VNC server, the XFCE session, and the noVNC web bridge.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; ---- Virtual X display + VNC server (DISPLAY=:1, port 5901) -------------
[program:xvnc]
priority=100
command=/usr/bin/Xtigervnc :1
    -geometry %(ENV_SCREEN_GEOMETRY)s
    -depth 24
    -rfbport 5901
    -SecurityTypes None
    -localhost no
    -AlwaysShared
autorestart=true
stdout_logfile=/var/log/supervisor/xvnc.log
stderr_logfile=/var/log/supervisor/xvnc.err

; ---- XFCE desktop session ----------------------------------------------
[program:xfce]
priority=200
command=/usr/local/bin/start-xfce.sh
autorestart=true
environment=DISPLAY=":1",HOME="/root"
stdout_logfile=/var/log/supervisor/xfce.log
stderr_logfile=/var/log/supervisor/xfce.err

; ---- noVNC web bridge (browser access on port 6080) --------------------
[program:novnc]
priority=300
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5901
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err
